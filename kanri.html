<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>訪販トーク管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{--paper:#F7F6F2;--paper-2:#FFFFFF;--ink:#16181B;--ink-2:#4A4E55;--ink-3:#7C818A;--rule:#D6D2C7;--rule-strong:#AFAA9C;--ai:#1F3A5F;--enji:#8C2F39;
--mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;--gothic:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#14161A;--paper-2:#1A1D22;--ink:#E9E7E1;--ink-2:#B4B8BF;--ink-3:#868C95;--rule:#2E333A;--rule-strong:#4A515B;--ai:#9DBCDF;--enji:#E3909A;}}
:root[data-theme="dark"]{--paper:#14161A;--paper-2:#1A1D22;--ink:#E9E7E1;--ink-2:#B4B8BF;--ink-3:#868C95;--rule:#2E333A;--rule-strong:#4A515B;--ai:#9DBCDF;--enji:#E3909A;}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--gothic);display:flex;align-items:center;justify-content:center;padding:28px;}
.gate{width:100%;max-width:430px;border-top:3px solid var(--ink);border-bottom:1px solid var(--rule-strong);padding:26px 0 30px;display:flex;flex-direction:column;gap:16px;}
.eyebrow{font-size:11px;letter-spacing:.3em;color:var(--enji);font-weight:700;}
h1{font-family:var(--mincho);font-weight:700;font-size:27px;letter-spacing:.06em;margin:0;line-height:1.3;}
p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.85;}
label{font-size:11.5px;letter-spacing:.1em;font-weight:700;color:var(--ink-3);}
.row{display:flex;flex-direction:column;gap:7px;}
input{font-family:var(--gothic);font-size:16px;padding:11px 13px;border:1px solid var(--rule-strong);background:var(--paper-2);color:var(--ink);width:100%;}
input:focus{outline:2px solid var(--ai);outline-offset:1px;}
button{font-family:var(--gothic);font-size:15px;font-weight:700;letter-spacing:.06em;padding:12px;border:0;background:var(--ink);color:var(--paper);cursor:pointer;}
button:disabled{opacity:.5;cursor:default;}
.msg{font-size:13px;min-height:1.6em;}
.msg.err{color:var(--enji);font-weight:700;}
.note{font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--rule);padding-top:12px;line-height:1.8;}
</style>
</head>
<body>
<form class="gate" id="g">
  <div class="eyebrow">社外秘</div>
  <h1>訪販トーク管理</h1>
  <p>顧客名と担当者名を含みます。閲覧できるのは管理職のみです。パスワードを他の方に転送しないでください。</p>
  <div class="row">
    <label for="p">パスワード</label>
    <input id="p" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
  </div>
  <button id="b" type="submit">開く</button>
  <div class="msg" id="m"></div>
  <div class="note">中身は暗号化されています。パスワードが合わない限り、ページのソースを見ても内容は取り出せません。</div>
</form>

function b2a(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
var f=document.getElementById('g'),inp=document.getElementById('p'),btn=document.getElementById('b'),msg=document.getElementById('m');
f.addEventListener('submit',function(e){
  e.preventDefault();
  if(!window.crypto||!window.crypto.subtle){msg.className='msg err';msg.textContent='このブラウザでは復号できません。ChromeかSafariで開いてください。';return;}
  var pw=inp.value;if(!pw)return;
  btn.disabled=true;msg.className='msg';msg.textContent='復号しています…（数秒かかります）';
  var enc=new TextEncoder();
  crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey'])
   .then(function(base){
     return crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
   })
   .then(function(key){
     return crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(IV)},key,b2a(DATA));
   })
   .then(function(buf){
     var html=new TextDecoder().decode(buf);
     document.open();document.write(html);document.close();
   })
   .catch(function(){
     btn.disabled=false;msg.className='msg err';msg.textContent='パスワードが違います。';inp.value='';inp.focus();
   });
});
inp.focus();
