<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>訪販トーク管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{--paper:#F6F4EF;--sheet:#FFFFFF;--ink:#13151A;--ink-2:#474C55;--ink-3:#7A7F89;--hair:#DCD7CB;--rule:#B6B0A2;--ai:#1C3557;--shu:#9B2C22;--grid:#EBE7DD;
--mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;--gothic:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#111317;--sheet:#171A1F;--ink:#ECEAE4;--ink-2:#B2B7BF;--ink-3:#848A94;--hair:#2A2F36;--rule:#464D57;--ai:#9EBDE0;--shu:#E0897E;--grid:#171A1F;}}
:root[data-theme="dark"]{--paper:#111317;--sheet:#171A1F;--ink:#ECEAE4;--ink-2:#B2B7BF;--ink-3:#848A94;--hair:#2A2F36;--rule:#464D57;--ai:#9EBDE0;--shu:#E0897E;--grid:#171A1F;}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font-family:var(--gothic);display:flex;align-items:center;justify-content:center;padding:26px 22px;
background-image:repeating-linear-gradient(90deg,transparent 0 95px,var(--grid) 95px 96px);}
.frame{width:100%;max-width:452px;padding:0 26px;}
.gate{display:flex;flex-direction:column;gap:0;border-top:3px solid var(--ink);}
.head{padding:22px 0 24px;display:flex;flex-direction:column;gap:11px;border-bottom:1px solid var(--hair);}
.seal{align-self:flex-start;font-family:var(--mincho);font-size:10px;font-weight:700;letter-spacing:.24em;color:var(--shu);border:1px solid var(--shu);padding:3px 9px 2px;line-height:1.4;}
h1{font-family:var(--mincho);font-weight:700;font-size:29px;letter-spacing:.16em;margin:0;line-height:1.28;}
.org{font-size:10.5px;letter-spacing:.18em;color:var(--ink-3);margin-top:-5px;}
p.warn{margin:0;font-size:12.8px;color:var(--ink-2);line-height:1.9;}
.row{display:flex;flex-direction:column;gap:9px;padding:24px 0 6px;}
label{font-size:10.5px;letter-spacing:.16em;font-weight:700;color:var(--ink-3);}
input{font-family:var(--mincho);font-size:19px;letter-spacing:.14em;padding:9px 2px;border:0;border-bottom:1.5px solid var(--rule);background:transparent;color:var(--ink);width:100%;border-radius:0;transition:border-color .18s;}
input::placeholder{color:var(--hair);}
input:focus{outline:none;border-bottom-color:var(--ink);}
button{font-family:var(--mincho);font-size:16px;font-weight:600;letter-spacing:.3em;padding:14px;border:0;background:var(--ink);color:var(--paper);cursor:pointer;margin-top:20px;transition:opacity .18s;}
button:hover{opacity:.86;}
button:disabled{opacity:.42;cursor:default;}
.msg{font-size:12.5px;min-height:1.7em;padding-top:11px;letter-spacing:.04em;color:var(--ink-3);}
.msg.err{color:var(--shu);font-weight:700;}
.foot{font-size:10.8px;color:var(--ink-3);border-top:1px solid var(--hair);padding:13px 0 22px;line-height:1.95;letter-spacing:.03em;}
@media (prefers-reduced-motion: reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="frame">
<form class="gate" id="g">
  <div class="head">
    <span class="seal">社外秘</span>
    <h1>訪販トーク管理</h1>
    <span class="org">株式会社TERRA ／ 訪問販売事業部</span>
  </div>
  <p class="warn" style="padding-top:20px;">顧客名と担当者名を含みます。閲覧は管理職に限ります。パスワードを他の方に転送しないでください。</p>
  <div class="row">
    <label for="p">パスワード</label>
    <input id="p" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="••••••••">
  </div>
  <button id="b" type="submit">開 く</button>
  <div class="msg" id="m"></div>
  <div class="foot">本文はAES-256で暗号化されています。パスワードが合わない限り、ページのソースを開いても内容は取り出せません。</div>
</form>
</div>

function b2a(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
var f=document.getElementById('g'),inp=document.getElementById('p'),btn=document.getElementById('b'),msg=document.getElementById('m');
f.addEventListener('submit',function(e){
  e.preventDefault();
  if(!window.crypto||!window.crypto.subtle){msg.className='msg err';msg.textContent='このブラウザでは復号できません。ChromeかSafariで開いてください。';return;}
  var pw=inp.value;if(!pw)return;
  btn.disabled=true;msg.className='msg';msg.textContent='復号しています…（数秒かかります）';
  var enc=new TextEncoder();
  crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey'])
   .then(function(base){
     return crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
   })
   .then(function(key){
     return crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(IV)},key,b2a(DATA));
   })
   .then(function(buf){
     var html=new TextDecoder().decode(buf);
     document.open();document.write(html);document.close();
   })
   .catch(function(){
     btn.disabled=false;msg.className='msg err';msg.textContent='パスワードが違います。';inp.value='';inp.focus();
   });
});
inp.focus();
